name: Build installers

# Push a tag like v1.0.0 (or run by hand) to get SushiSetup.exe and Sushi.dmg.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller packaging/sushi.spec --noconfirm --distpath build/dist --workpath build/work
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:SUSHI_VERSION = "${{ github.ref_name }}".TrimStart("v")
          if ($env:SUSHI_VERSION -notmatch '^\d') { $env:SUSHI_VERSION = "1.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: build/installer/*.exe }

  macos:
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - name: Icon
        run: |
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s sushi/data/logo.png --out icon.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) sushi/data/logo.png --out icon.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns icon.iconset -o sushi/data/logo.icns
      - run: pyinstaller packaging/sushi.spec --noconfirm --distpath build/dist --workpath build/work
      - name: DMG
        run: |
          brew install create-dmg
          mkdir -p build/installer
          create-dmg --volname Sushi --app-drop-link 450 180 --window-size 640 360 \
            --icon "Sushi.app" 180 180 build/installer/Sushi.dmg build/dist/Sushi.app
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: build/installer/Sushi.dmg }

  release:
    # Publish whatever built: a Mac runner that is unavailable (billing on
    # private repos) must not hold back the Windows installer.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/*.exe
            macos/*.dmg
          fail_on_unmatched_files: false
